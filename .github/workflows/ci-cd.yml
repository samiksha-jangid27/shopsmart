name: ShopSmart CI/CD

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  TF_STATE_BUCKET: shopsmart-tfstate-samiksha-20260505
  TF_STATE_KEY: shopsmart/terraform.tfstate
  TF_DIR: infra
  ECR_REPOSITORY: shopsmart-api
  ECS_CLUSTER: shopsmart-cluster
  ECS_SERVICE: shopsmart-service
  ECS_TASK_DEFINITION: infra/task-definition.json
  ECS_CONTAINER_NAME: shopsmart-api
  ECS_TASK_EXECUTION_ROLE_ARN: arn:aws:iam::857558323395:role/LabRole
  ECS_TASK_ROLE_ARN: arn:aws:iam::857558323395:role/LabRole

jobs:
  server-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install server dependencies
        working-directory: server
        run: npm install

      - name: Run server tests with JUnit output
        working-directory: server
        env:
          CI: true
          JEST_JUNIT_OUTPUT_FILE: junit.xml
        run: npm test

      - name: Upload server test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-junit-report
          path: server/junit.xml

  client-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install client dependencies
        working-directory: client
        run: npm install

      - name: Run client tests
        working-directory: client
        env:
          CI: true
        run: npm test -- --run

  terraform:
    runs-on: ubuntu-latest
    needs:
      - server-tests
      - client-tests
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.5

      - name: Ensure Terraform state bucket exists
        run: |
          if ! aws s3api head-bucket --bucket "$TF_STATE_BUCKET" 2>/dev/null; then
            if [ "$AWS_REGION" = "us-east-1" ]; then
              aws s3api create-bucket --bucket "$TF_STATE_BUCKET"
            else
              aws s3api create-bucket \
                --bucket "$TF_STATE_BUCKET" \
                --create-bucket-configuration "LocationConstraint=$AWS_REGION"
            fi
          fi

      - name: Terraform init
        working-directory: infra
        run: |
          terraform init \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="key=${TF_STATE_KEY}" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="encrypt=true"

      - name: Terraform validate
        working-directory: infra
        run: terraform validate

      - name: Terraform plan
        working-directory: infra
        run: |
          terraform plan -out=tfplan \
            -var="use_existing_iam_roles=true" \
            -var="ecs_task_execution_role_arn=${ECS_TASK_EXECUTION_ROLE_ARN}" \
            -var="ecs_task_role_arn=${ECS_TASK_ROLE_ARN}"

      - name: Terraform apply
        working-directory: infra
        run: terraform apply -auto-approve tfplan

  build-and-push:
    runs-on: ubuntu-latest
    needs:
      - terraform
    outputs:
      image_uri: ${{ steps.meta.outputs.image_uri }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Set image metadata
        id: meta
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          IMAGE_URI="$ACCOUNT_ID.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPOSITORY}"
          echo "image_uri=$IMAGE_URI" >> "$GITHUB_OUTPUT"

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push server image
        uses: docker/build-push-action@v6
        with:
          context: ./server
          file: ./docker/Dockerfile.server
          push: true
          tags: |
            ${{ steps.meta.outputs.image_uri }}:${{ github.sha }}
            ${{ steps.meta.outputs.image_uri }}:latest

  deploy:
    runs-on: ubuntu-latest
    needs:
      - build-and-push
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare ECS task definition with real IAM role ARNs
        run: |
          jq \
            --arg executionRoleArn "$ECS_TASK_EXECUTION_ROLE_ARN" \
            --arg taskRoleArn "$ECS_TASK_ROLE_ARN" \
            '.executionRoleArn = $executionRoleArn | .taskRoleArn = $taskRoleArn' \
            "$ECS_TASK_DEFINITION" > "$RUNNER_TEMP/task-definition.json"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Set deploy image metadata
        id: deploy-meta
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          IMAGE_URI="$ACCOUNT_ID.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPOSITORY}"
          echo "image_uri=$IMAGE_URI" >> "$GITHUB_OUTPUT"

      - name: Render ECS task definition
        id: render-task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ${{ runner.temp }}/task-definition.json
          container-name: ${{ env.ECS_CONTAINER_NAME }}
          image: ${{ steps.deploy-meta.outputs.image_uri }}:${{ github.sha }}

      - name: Deploy to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-task-def.outputs.task-definition }}
          cluster: ${{ env.ECS_CLUSTER }}
          service: ${{ env.ECS_SERVICE }}
          wait-for-service-stability: true

      - name: Verify service is responding
        run: |
          ALB_DNS=$(aws elbv2 describe-load-balancers --names shopsmart-alb --query 'LoadBalancers[0].DNSName' --output text)
          for i in $(seq 1 20); do
            if curl -fsS "http://${ALB_DNS}/api/health"; then
              exit 0
            fi
            sleep 15
          done
          exit 1