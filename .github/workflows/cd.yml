name: ShopSmart CD

on:
  workflow_dispatch: {}

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  ECS_CLUSTER: shopsmart-cluster
  TF_STATE_BUCKET: shopsmart-tfstate-samiksha-20260505
  TF_STATE_KEY: shopsmart/terraform.tfstate
  TF_DIR: terraform

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.5

      - name: Ensure Terraform state bucket exists
        run: |
          if ! aws s3api head-bucket --bucket "${TF_STATE_BUCKET}" 2>/dev/null; then
            if [ "${AWS_REGION}" = "us-east-1" ]; then
              aws s3api create-bucket --bucket "${TF_STATE_BUCKET}"
            else
              aws s3api create-bucket --bucket "${TF_STATE_BUCKET}" --create-bucket-configuration "LocationConstraint=${AWS_REGION}"
            fi
          fi

      - name: Terraform init
        working-directory: ${{ env.TF_DIR }}
        run: |
          terraform init -backend-config="bucket=${TF_STATE_BUCKET}" -backend-config="key=${TF_STATE_KEY}" -backend-config="region=${AWS_REGION}" -backend-config="encrypt=true"

      - name: Terraform validate
        working-directory: ${{ env.TF_DIR }}
        run: terraform validate

      - name: Compute ECR repository URIs
        id: meta
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          API_REPO="$ACCOUNT_ID.dkr.ecr.${AWS_REGION}.amazonaws.com/shopsmart-api"
          CLIENT_REPO="$ACCOUNT_ID.dkr.ecr.${AWS_REGION}.amazonaws.com/shopsmart-client"
          echo "api_repo=$API_REPO" >> "$GITHUB_OUTPUT"
          echo "client_repo=$CLIENT_REPO" >> "$GITHUB_OUTPUT"

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push server image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/Dockerfile.server
          push: true
          tags: |
            ${{ steps.meta.outputs.api_repo }}:${{ github.sha }}
            ${{ steps.meta.outputs.api_repo }}:latest

      - name: Build and push client image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/Dockerfile.client
          push: true
          tags: |
            ${{ steps.meta.outputs.client_repo }}:${{ github.sha }}
            ${{ steps.meta.outputs.client_repo }}:latest

      - name: Terraform plan
        working-directory: ${{ env.TF_DIR }}
        run: |
          terraform plan -out=tfplan -var "api_image=${{ steps.meta.outputs.api_repo }}:${{ github.sha }}" -var "client_image=${{ steps.meta.outputs.client_repo }}:${{ github.sha }}"

      - name: Deploy updated images via Terraform
        working-directory: ${{ env.TF_DIR }}
        run: terraform apply -auto-approve tfplan

      - name: Verify service is responding
        run: |
          ALB_DNS=$(aws elbv2 describe-load-balancers --names shopsmart-alb --query 'LoadBalancers[0].DNSName' --output text)
          for i in $(seq 1 20); do
            if curl -fsS "http://${ALB_DNS}/api/health"; then
              exit 0
            fi
            sleep 15
          done
          exit 1
