name: ShopSmart CD

on:
  workflow_dispatch: {}

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  ECR_REPOSITORY: shopsmart-api
  ECS_CLUSTER: shopsmart-cluster
  ECS_SERVICE: shopsmart-service
  ECS_TASK_DEFINITION: terraform/task-definition.json
  ECS_CONTAINER_NAME: shopsmart-api

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set image metadata
        id: meta
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          IMAGE_URI="$ACCOUNT_ID.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPOSITORY}"
          echo "image_uri=$IMAGE_URI" >> "$GITHUB_OUTPUT"

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push server image
        uses: docker/build-push-action@v6
        with:
          context: ./server
          file: ./docker/Dockerfile.server
          push: true
          tags: |
            ${{ steps.meta.outputs.image_uri }}:${{ github.sha }}
            ${{ steps.meta.outputs.image_uri }}:latest

      - name: Render ECS task definition
        id: render-task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ${{ env.ECS_TASK_DEFINITION }}
          container-name: ${{ env.ECS_CONTAINER_NAME }}
          image: ${{ steps.meta.outputs.image_uri }}:${{ github.sha }}

      - name: Deploy to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-task-def.outputs.task-definition }}
          cluster: ${{ env.ECS_CLUSTER }}
          service: ${{ env.ECS_SERVICE }}
          wait-for-service-stability: true

      - name: Verify service is responding
        run: |
          ALB_DNS=$(aws elbv2 describe-load-balancers --names shopsmart-alb --query 'LoadBalancers[0].DNSName' --output text)
          for i in $(seq 1 20); do
            if curl -fsS "http://${ALB_DNS}/api/health"; then
              exit 0
            fi
            sleep 15
          done
          exit 1
